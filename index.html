<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporary Pacing Lab</title>
<style>
  :root { --bg:#f7f5f2; --card:#fff; --ink:#212A34; --muted:#5b6672; --accent:#BF5700; --line:#e3ded7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1d232a; --ink:#e9edf1; --muted:#a3adb8; --accent:#ff8a3d; --line:#2c343d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; line-height:1.5; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 6px; font-size:28px; }
  p.lead { margin:0 0 28px; color:var(--muted); }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); transform:translateY(-2px); }
  a.card h2 { margin:0 0 6px; font-size:18px; color:var(--accent); }
  a.card p { margin:0; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Temporary Pacing Lab</h1>
  <p class="lead">Temporary epicardial pacing simulator. Pick a mode to begin.</p>
  <div class="grid">
    <a class="card" href="teach.html"><h2>Teach</h2><p>Guided walkthrough with explanations for instructor-led sessions.</p></a>
    <a class="card" href="practice.html"><h2>Practice</h2><p>Hands-on scenarios to build skills at your own pace.</p></a>
    <a class="card" href="checkoff.html"><h2>Check off</h2><p>Competency check-off with a summary report.</p></a>
  </div>
</main>
</body>
</html>
